run:
  name: brazil_sensitivity_rate_1000_v1
  phase: pre_full_training
  description: Brazil-inspired v1 C-lite sensitivity; fixed transferred decision margins.
  status: phase5_accounting_verified
environment:
  class_path: src.environment.tax_aware_env.TaxAwareEnv
  parquet_path: data/episodes/drl_episodes_brazil_v1.parquet
  state_schema_path: data/freeze/v2/allowed_state_columns_v2.json
  reset_mode: episode_id
  observation_source: allowed_state_columns_v2
  terminal_conditions:
    done_on_final_row: true
    done_on_full_liquidation: true
    truncated: false
  terminal_liquidation:
    enabled: true
    tax_regime: flat_positive_gains
reward:
  version: brazil_v1_total_after_tax_wealth_change_minus_cooldown_penalty
  use_environment_reward: true
  assert_reward_version: true
  expected_info_reward_version: brazil_v1_total_after_tax_wealth_change_minus_cooldown_penalty
  base_reward_version: brazil_v1_total_after_tax_wealth_change
  use_drawdown_penalty: false
  use_transaction_penalty: false
  use_cooldown_penalty: true
  use_explicit_tax_saving_bonus: false
  use_reward_clipping: false
  use_reward_normalization: false
  cooldown_penalty:
    enabled: true
    lambda_cooldown: 0.0025
    cooldown_days: 20
    scale_by_executed_fraction: true
    penalize_first_sale: false
data:
  episode_id_column: episode_id
  date_column: date
  pnl_column: unrealized_gains_pct
  max_episodes_debug: 20
  max_episodes_train: null
  require_sorted_by:
  - episode_id
  - date
  terminal_date_source: last_episode_row
action_space:
  type: discrete_fraction_of_original_position
  action_fractions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  action_meanings:
    '0': hold
    '1': sell_25pct_original_position
    '2': sell_50pct_original_position
    '3': sell_75pct_original_position
    '4': sell_100pct_original_position
  oversell_clamp: true
exploration:
  random_action_policy: hold_biased
  action_probabilities:
  - 0.5
  - 0.2
  - 0.15
  - 0.1
  - 0.05
splits:
  source_csv: runs/train_reward_c_lite_v5_full/episode_splits.csv
  method: chronological_by_episode
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  shuffle_episodes: false
  leakage_guard:
    split_by_episode_id: true
    no_row_level_mixing_across_splits: true
algorithm:
  name: dqn
  reason: Discrete action space with five fixed sell fractions.
  framework: torch
  policy_network:
    hidden_layers:
    - 128
    - 128
    activation: relu
  target_network:
    enabled: true
    update_frequency_steps: 1000
  replay_buffer:
    enabled: true
    capacity: 50000
    batch_size: 64
training:
  seed: 42
  device: auto
  debug_first: false
  num_epochs: 3
  debug:
    episodes: 20
    max_steps_per_episode: null
    purpose: Verify training loop, reward plumbing, and loss stability before full
      run.
  full_run:
    episodes: null
    max_steps_per_episode: null
  discount_factor_gamma: 1.0
  learning_rate: 0.0001
  optimizer: adam
  epsilon_schedule:
    start: 1.0
    end: 0.05
    decay_steps: 145000
  gradient_clip_norm: 10.0
  checkpoint_frequency_episodes: 500
  save_best_validation_model: true
  best_model_metric: mean_final_total_after_tax_wealth
  best_model_mode: max
evaluation:
  evaluate_during_training: true
  evaluation_frequency_episodes: 500
  max_eval_episodes: 500
  deterministic_policy: true
  benchmark_policies:
  - hold_to_terminal
  - sell_immediately
  - sell_half_then_hold
  - sell_quarters_over_time
  - random_policy
  primary_metrics:
  - mean_episode_total_reward
  - median_episode_total_reward
  - final_total_after_tax_wealth
  - excess_wealth_versus_hold
  - discretionary_sale_count
  - first_sale_days_from_start
  sanity_assertions:
    reward_identity: true
    episode_reward_telescoping: true
    no_nan_rewards: true
    no_infinite_rewards: true
    reward_version_matches_config: true
  fixed_decision_margins:
    first_sale: 0.07
    subsequent_sale: 0.02
logging:
  output_dir: runs/brazil_sensitivity_rate_1000_v1
  save_config_copy: true
  save_training_metrics: true
  save_episode_rollouts: true
  save_model_checkpoints: true
  save_final_model: true
  tensorboard:
    enabled: false
    log_dir: runs/brazil_sensitivity_rate_1000_v1/tensorboard
  csv_logs:
    train_metrics: runs/brazil_sensitivity_rate_1000_v1/train_metrics.csv
    eval_metrics: runs/brazil_sensitivity_rate_1000_v1/eval_metrics.csv
    train_episode_rollouts: runs/brazil_sensitivity_rate_1000_v1/train_episode_rollouts.csv
    validation_episode_rollouts: runs/brazil_sensitivity_rate_1000_v1/validation_episode_rollouts.csv
reproducibility:
  python_seed: 42
  numpy_seed: 42
  torch_seed: 42
  deterministic_torch: false
  record_git_commit: true
  record_config_hash: true
notes:
- Phase 4 scenario parquet and v2 state freeze are available locally; Phase 5 accounting
  and capped smoke checks precede any full training.
- Full training and test evaluation remain separate later phases.
- Use one seed (42), validation final normalized wealth, and fixed 0.070/0.020 decision
  margins without a margin sweep.
economic_scenario:
  name: brazil_inspired_v1
  equity_tax:
    regime: flat_positive_gains
    rate: 0.15
    loss_credit: false
  cash_account:
    enabled: true
    annual_gross_rate: 0.1
    compounding: effective_annual_market_252
    market_days_per_year: 252
    interest_tax:
      regime: holding_period_tiers
      tiers:
      - max_calendar_days: 180
        rate: 0.225
      - max_calendar_days: null
        rate: 0.2
  terminal_horizon: episode_end
  currency: USD
  fx_conversion: false
